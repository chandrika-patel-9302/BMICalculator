<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            background-color: black;
            color: white;
        }
        nav{
            display: flex;
            justify-content: center;
            gap: 5%;
            background-color: lightgrey;
            padding: 10px;
        }
        nav a{
            border: 2px solid black;
            text-decoration: none;
            padding-left: 15px;
            padding-right: 15px;
            background-color: grey;
            color: black;
        }
        .container{
            padding: 2%;
        }
        button{
            padding-left: 40px;
            padding-right: 40px;
            padding-bottom: 5px;
            padding-top: 5px;
            border-radius: 5px;
            border: 2px solid black;
            background-color: white;
            color: black;
        }

    </style>
</head>
<body>
    <nav>
        <a href="/" aria-current="page">Home</a>
        <a target="_blank" href="google.com">Google</a>
    </nav>
    <div class="container">
        <h1>BMI calculator</h1> <hr><br>
        <form action="">
            <p><label for="">Height in CM</label><input type="text" id="height"></p><br>
            <p><label for="">Weight in KG</label><input type="text" id="weight"></p><br><br>
            <button>Calculate</button> <br><br>
            <div id="results"></div>
            <div id="weight-guide">
                <h1>BMI weight Guide</h1>
                <p class = "message" id="Under_weight">Under weight = less than 18.6</p>
                <p class = "message" id="Normal_weight">Normal Range = 18.6 and 24.9</p>
                <p class = "message" id="Overweight">Overweight = greter than 24.9</p>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
